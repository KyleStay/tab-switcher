<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Switcher Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Tab Switcher Settings</h1>
      </header>

      <section class="shortcuts" aria-labelledby="shortcutsHeading">
        <div class="section-header">
          <h2 id="shortcutsHeading">Keyboard shortcuts</h2>
          <button type="button" id="openShortcutSettings" disabled>Change in Chrome</button>
        </div>
        <dl id="shortcutSummary" aria-live="polite"><div><dt>Loading shortcuts…</dt></div></dl>
      </section>

      <section class="settings-grid" aria-labelledby="switchingHeading">
        <h2 id="switchingHeading">Tab switching</h2>
        <div class="setting-row">
          <span class="setting-name"><label for="setting-launchMode">Launch behavior</label> <button type="button" class="help-button" aria-label="Launch behavior help" data-help="The Chrome popup opens from the toolbar. The centered overlay opens on the page and falls back to the toolbar popup on restricted pages.">?</button></span>
          <select id="setting-launchMode" name="launchMode" disabled>
            <option value="hybrid">Centered overlay with popup fallback</option>
            <option value="popup">Popup only</option>
          </select>
        </div>

        <div class="setting-row stacked-field" id="popupSites" hidden>
          <span class="setting-name"><label for="setting-extensionViewHosts">Always use popup on these sites</label> <button type="button" class="help-button" aria-label="Extension view sites help" data-help="Enter one hostname or URL per line to skip the overlay on those sites.">?</button></span>
          <textarea
            id="setting-extensionViewHosts" name="extensionViewHosts"
            rows="5"
            spellcheck="false"
            placeholder="mail.google.com&#10;docs.google.com"
            disabled
          ></textarea>
        </div>

        <div class="setting-row">
          <span class="setting-name"><label for="setting-currentWindowOnly">Search current window only</label> <button type="button" class="help-button" aria-label="Search current window only help" data-help="Limit results to tabs in the current browser window.">?</button></span>
          <input type="checkbox" id="setting-currentWindowOnly" name="currentWindowOnly" disabled>
        </div>
        <div class="setting-row">
          <span class="setting-name"><label for="setting-mruCycleScope">Recent-tab shortcut scope</label> <button type="button" class="help-button" aria-label="Recent-tab shortcut scope help" data-help="Choose whether the recent-tab shortcuts move across all browser windows or stay inside the current window.">?</button></span>
          <select id="setting-mruCycleScope" name="mruCycleScope" disabled>
            <option value="all-windows">Across all windows</option>
            <option value="current-window">Current window only</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-name"><label for="setting-includeClosedTabs">Include recently closed tabs</label> <button type="button" class="help-button" aria-label="Recently closed tabs help" data-help="Show recently closed tabs in the switcher so they can be restored.">?</button></span>
          <input type="checkbox" id="setting-includeClosedTabs" name="includeClosedTabs" disabled>
        </div>
        <div class="setting-row">
          <span class="setting-name"><label for="setting-restorePreviousQuery">Restore previous query</label> <button type="button" class="help-button" aria-label="Restore previous query help" data-help="Restore the last search during this browser session. Queries are not saved while private tab support is enabled.">?</button></span>
          <input type="checkbox" id="setting-restorePreviousQuery" name="restorePreviousQuery" disabled>
        </div>
      </section>

      <section class="settings-grid" aria-labelledby="appearanceHeading">
        <h2 id="appearanceHeading">Appearance</h2>
        <div class="setting-row">
          <span class="setting-name"><label for="setting-theme">Theme</label> <button type="button" class="help-button" aria-label="Theme help" data-help="Choose the switcher color theme, or follow your system appearance.">?</button></span>
          <select id="setting-theme" name="theme" disabled>
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-name"><label for="setting-density">Density</label> <button type="button" class="help-button" aria-label="Density help" data-help="Choose compact rows or roomier rows in the switcher.">?</button></span>
          <select id="setting-density" name="density" disabled>
            <option value="compact">Compact</option>
            <option value="comfy">Comfortable</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-name"><label for="setting-maxResults">Maximum results</label> <button type="button" class="help-button" aria-label="Maximum results help" data-help="Maximum number of matching tabs and recently closed entries shown in the switcher.">?</button></span>
          <span class="field-control">
            <input type="number" id="setting-maxResults" name="maxResults" min="20" max="300" step="1" disabled>
            <span class="unit-label">results</span>
          </span>
        </div>
      </section>

      <details class="private-settings">
        <summary>Private tabs</summary>
        <section class="settings-grid" aria-label="Private tab settings">
          <p id="privateTabsAccessMessage" class="setting-help">Checking private access…</p>
          <div class="setting-row">
            <span class="setting-name"><label for="setting-privateTabsEnabled">Enable private tab support</label> <button type="button" class="help-button" aria-label="Enable private tab support help" data-help="Allow Tab Switcher to show private/incognito tabs when Chrome grants this extension incognito access.">?</button></span>
            <input type="checkbox" id="setting-privateTabsEnabled" name="privateTabsEnabled" data-private-control="root" disabled>
          </div>
          <div class="setting-row">
            <span class="setting-name"><label for="setting-privateTabDisplayMode">Display mode</label> <button type="button" class="help-button" aria-label="Private tab display mode help" data-help="Choose whether private tabs are hidden, grouped under a Private tabs heading, or integrated with normal tab results.">?</button></span>
            <select id="setting-privateTabDisplayMode" name="privateTabDisplayMode" data-private-control="dependent" disabled>
              <option value="hidden">Hidden</option>
              <option value="grouped">Grouped</option>
              <option value="integrated">Integrated</option>
            </select>
          </div>
          <div class="setting-row">
            <span class="setting-name"><label for="setting-privateTabIndicator">Private indicator</label> <button type="button" class="help-button" aria-label="Private indicator help" data-help="Choose how private tabs are visually marked in results.">?</button></span>
            <select id="setting-privateTabIndicator" name="privateTabIndicator" data-private-control="dependent" disabled>
              <option value="icon">Private window icon</option>
              <option value="label">Private label</option>
              <option value="icon-label">Icon and label</option>
              <option value="none">No extra indicator</option>
            </select>
          </div>
          <fieldset class="checkbox-group" data-private-control="dependent">
            <legend><span class="setting-name">Obscure private fields <button type="button" class="help-button" aria-label="Obscure private fields help" data-help="Choose which private tab details are masked until the reveal behavior allows them to be shown.">?</button></span></legend>
            <label>
              <span>Title</span>
              <input type="checkbox" name="privateMaskTitle" disabled>
            </label>
            <label>
              <span>URL path and query</span>
              <input type="checkbox" name="privateMaskUrl" disabled>
            </label>
            <label>
              <span>Domain and full URL copying</span>
              <input type="checkbox" name="privateMaskDomain" disabled>
            </label>
            <label>
              <span>Favicon</span>
              <input type="checkbox" name="privateMaskFavicon" disabled>
            </label>
          </fieldset>
          <div class="setting-row">
            <span class="setting-name"><label for="setting-privateRevealMode">Reveal behavior</label> <button type="button" class="help-button" aria-label="Reveal behavior help" data-help="Choose when masked private tab details become visible: never, selected row only, while open, for a timed duration, or manually.">?</button></span>
            <select id="setting-privateRevealMode" name="privateRevealMode" data-private-control="dependent" disabled>
              <option value="never">Never reveal</option>
              <option value="selected">Reveal selected item only</option>
              <option value="session">Reveal while popup is open</option>
              <option value="timed">Reveal for duration</option>
              <option value="manual">Reveal until manually hidden again</option>
            </select>
          </div>
          <div class="setting-row">
            <span class="setting-name"><label for="setting-privateRevealDurationMinutes">Reveal duration</label> <button type="button" class="help-button" aria-label="Reveal duration help" data-help="How long private tab details stay unmasked when reveal behavior is set to Reveal for duration. Unit: minutes.">?</button></span>
            <span class="field-control">
              <input
                type="number"
                id="setting-privateRevealDurationMinutes" name="privateRevealDurationMinutes"
                min="1"
                max="1440"
                step="1"
                inputmode="numeric"
                data-private-control="dependent"
                disabled
              >
              <span class="unit-label">minutes</span>
            </span>
          </div>
          <div class="setting-row">
            <span class="setting-name"><label for="setting-privateSearchHiddenContent">Search hidden private tab contents</label> <button type="button" class="help-button" aria-label="Search hidden private tab contents help" data-help="Allow fuzzy search to match masked private tab titles and URLs. This can reveal that a hidden private page exists.">?</button></span>
            <input type="checkbox" id="setting-privateSearchHiddenContent" name="privateSearchHiddenContent" data-private-control="dependent" disabled>
          </div>
          <p class="setting-help">Searching hidden contents can reveal that a masked private page exists.</p>
        </section>
      </details>

      <div class="actions">
        <button type="button" id="resetSettings" disabled>Reset to defaults</button>
        <p class="save-status" id="saveStatus" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
