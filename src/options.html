<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Switcher Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Tab Switcher</h1>
        <p>Make tab switching feel like quick open in your editor.</p>
      </header>

      <section>
        <div>
          <h2>Shortcuts</h2>
          <p id="shortcutSummary">Loading shortcuts…</p>
        </div>
        <button type="button" id="openShortcutSettings">Open Chrome Shortcuts</button>
      </section>

      <section class="settings-grid">
        <label>
          <span>Current window only</span>
          <input type="checkbox" name="currentWindowOnly">
        </label>
        <label>
          <span>Include recently closed tabs</span>
          <input type="checkbox" name="includeClosedTabs">
        </label>
        <label>
          <span>Restore previous query</span>
          <input type="checkbox" name="restorePreviousQuery">
        </label>
        <label>
          <span>Theme</span>
          <select name="theme">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <label>
          <span>Density</span>
          <select name="density">
            <option value="compact">Compact</option>
            <option value="comfy">Comfy</option>
          </select>
        </label>
        <label>
          <span>Maximum results</span>
          <input type="number" name="maxResults" min="20" max="300" step="5">
        </label>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
