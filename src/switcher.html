<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Switcher</title>
    <link rel="stylesheet" href="switcher.css">
  </head>
  <body>
    <main class="shell" data-density="compact">
      <section class="onboarding" id="onboarding" hidden>
        <div>
          <h1>Tab Switcher</h1>
          <p>Chrome may reserve shortcuts like Ctrl+Tab. Confirm Command+E, Ctrl+E, Option+E, or Alt+E in extension shortcut settings.</p>
        </div>
        <button type="button" id="shortcutSettingsButton">Shortcuts</button>
        <button type="button" class="icon-button" id="dismissOnboardingButton" aria-label="Dismiss">×</button>
      </section>

      <label class="search" for="queryInput">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <span class="sr-only">Search open and recently closed tabs</span>
        <input
          id="queryInput"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search tabs"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="results"
          aria-expanded="true"
        >
      </label>

      <div class="meta">
        <span id="resultSummary" role="status" aria-live="polite">Loading tabs...</span>
        <div class="meta-actions">
          <button type="button" id="retryButton" hidden>Retry</button>
          <button type="button" id="popupButton" hidden>Popup</button>
          <button type="button" id="extensionViewButton">Use popup here</button>
          <button type="button" id="optionsButton">Options</button>
        </div>
      </div>

      <ul class="results" id="results" role="listbox" aria-label="Tabs" aria-busy="true"></ul>
      <div class="empty results-message" id="resultsMessage" hidden></div>

      <footer class="hints">
        <span>Enter switch</span>
        <span id="cycleHint">Arrows cycle</span>
        <span>Esc clear/close</span>
        <span id="copyHint">Ctrl+C copy URL</span>
        <span id="closeHint">Ctrl+W close tab</span>
        <span id="revealHint" hidden></span>
      </footer>
    </main>
    <script type="module" src="switcher.js"></script>
  </body>
</html>
