<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Switcher</title>
    <link rel="stylesheet" href="switcher.css">
  </head>
  <body>
    <main class="shell" data-density="compact">
      <label class="search" for="queryInput">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="sr-only">Search open and recently closed tabs</span>
        <input
          id="queryInput"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search tabs"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="results"
          aria-expanded="false"
        >
      </label>

      <section class="onboarding" id="onboarding" hidden>
        <div>
          <h1>Tab Switcher</h1>
          <p id="onboardingShortcut">Set or change the keyboard shortcut in Chrome.</p>
        </div>
        <button type="button" id="shortcutSettingsButton">Shortcuts</button>
        <button type="button" class="icon-button" id="dismissOnboardingButton" aria-label="Dismiss shortcut help">×</button>
      </section>

      <div class="meta">
        <span id="resultSummary" role="status">Loading tabs…</span>
        <div class="meta-actions">
          <button type="button" id="retryButton" hidden>Retry</button>
          <button type="button" id="popupButton" hidden>Open toolbar popup</button>
          <button type="button" id="extensionViewButton" hidden>Always use popup here</button>
          <button type="button" id="optionsButton">Settings</button>
        </div>
      </div>

      <ul class="results" id="results" role="listbox" aria-label="Tabs" aria-busy="true"></ul>
      <div class="empty results-message" id="resultsMessage" hidden></div>

      <footer class="hints">
        <span><kbd>↑ ↓</kbd> Navigate</span>
        <span><kbd>Enter</kbd> <span id="enterHint">Switch</span></span>
        <span><kbd>Esc</kbd> <span id="escapeHint">Dismiss</span></span>
        <span><kbd id="copyHint">Ctrl+C</kbd> Copy URL</span>
        <span hidden><kbd id="closeHint">Backspace</kbd> Close tab</span>
        <span id="revealHint" hidden><kbd id="revealKey">Ctrl+R</kbd> Reveal private</span>
      </footer>
    </main>
    <script type="module" src="switcher.js"></script>
  </body>
</html>
